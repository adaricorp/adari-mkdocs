name: Build and Publish MkDocs Container Image

on:
  push:
    branches:
      - main
      - master
    paths:
      # Rebuild when Dockerfile or requirements change
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build-and-publish.yml"
  # Allow manual trigger
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adaricorp/adari-mkdocs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The docs image is a bundle, but mkdocs-material is its headline
      # component — "the mkdocs version" for a Material site. We tag the image
      # from the pinned mkdocs-material version in requirements.txt, exactly the
      # way the kea-dhcp4 image tags from its Dockerfile ARG VERSION. Renovate
      # bumps that pin, this republishes a new numbered tag automatically, and
      # adarigod's Renovate follows it — no GitHub Release step.
      #
      # Caveat: when a *different* plugin bumps but mkdocs-material does not, the
      # version tag is unchanged and that build refreshes the same tag + :latest.
      # For a docs image that's acceptable.
      - name: Determine version from mkdocs-material
        id: version
        run: |
          version="$(grep -oP '^mkdocs-material==\K.*' requirements.txt)"
          if [ -z "$version" ]; then
            echo "::error::Could not read pinned 'mkdocs-material==' from requirements.txt"
            exit 1
          fi
          echo "material=$version" >> "$GITHUB_OUTPUT"
          echo "material_minor=$(echo "$version" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "Building adari-mkdocs on mkdocs-material $version"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # mkdocs-material version — the tag adarigod pins
            type=raw,value=${{ steps.version.outputs.material }}
            # Floating major.minor for humans (e.g. 9.7)
            type=raw,value=${{ steps.version.outputs.material_minor }}
            # latest on the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Short commit SHA for traceability
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed successfully!"
